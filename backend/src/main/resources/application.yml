spring:
  application:
    name: hr-platform
  profiles:
    default: dev
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      transaction-isolation: TRANSACTION_READ_COMMITTED
  flyway:
    enabled: true
    clean-disabled: true
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 24MB
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 8h
      cookie:
        name: HR_SESSION
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
hr:
  user-center-base-url: ${HR_USER_CENTER_BASE_URL:}
  encryption-key: ${HR_ENCRYPTION_KEY:}
  upload-directory: ${HR_UPLOAD_DIRECTORY:./data/uploads}
  allowed-origins: ${HR_ALLOWED_ORIGINS:http://127.0.0.1:5180,http://localhost:5180,http://127.0.0.1:8090,http://localhost:8090}
  seed-demo: ${HR_SEED_DEMO:false}
