services:
  database:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-hrms}
      MYSQL_USER: ${DB_USERNAME:-hr_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set the production database password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a distinct database administrator password}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --host=127.0.0.1 --user=$$MYSQL_USER --batch --execute='SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]
  backend:
    build: { context: .., dockerfile: deploy/backend.Dockerfile }
    restart: unless-stopped
    depends_on:
      database: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://database:3306/${DB_NAME:-hrms}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${DB_USERNAME:-hr_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set the production database password}
      HR_ENCRYPTION_KEY: ${HR_ENCRYPTION_KEY:?Set a base64 encoded 32-byte encryption key}
      HR_INITIAL_ADMIN_PASSWORD: ${HR_INITIAL_ADMIN_PASSWORD:?Set the initial admin password}
      HR_INITIAL_MANAGER_PASSWORD: ${HR_INITIAL_MANAGER_PASSWORD:?Set the initial manager password}
      HR_ALLOWED_ORIGINS: ${HR_ALLOWED_ORIGINS:?Set the public HTTPS origin}
      HR_SEED_DEMO: "false"
      COOKIE_SECURE: "true"
      SERVER_ADDRESS: 0.0.0.0
      HR_UPLOAD_DIRECTORY: /app/uploads
    volumes: ["uploads:/app/uploads"]
    networks: [private]
  web:
    build: { context: .., dockerfile: deploy/frontend.Dockerfile }
    restart: unless-stopped
    depends_on: [backend]
    ports: ["127.0.0.1:${WEB_PORT:-8088}:8080"]
    networks: [private]
volumes:
  mysql-data:
  uploads:
networks:
  private:
